<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bar6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="700" height="480" fill="#f8fafc" rx="8"/>

  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Fugusashi Routing Accuracy (v1.3.0)</text>

  <!-- Chart area: x=100 to x=650, y=50 to y=380, baseline at y=370 -->
  <line x1="100" y1="370" x2="650" y2="370" stroke="#94a3b8" stroke-width="2"/>
  <line x1="100" y1="50" x2="100" y2="370" stroke="#94a3b8" stroke-width="2"/>

  <!-- Y-axis labels and gridlines -->
  <line x1="100" y1="114" x2="650" y2="114" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="90" y="118" text-anchor="end" font-size="11" fill="#64748b">80%</text>

  <line x1="100" y1="178" x2="650" y2="178" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="90" y="182" text-anchor="end" font-size="11" fill="#64748b">60%</text>

  <line x1="100" y1="242" x2="650" y2="242" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="90" y="246" text-anchor="end" font-size="11" fill="#64748b">40%</text>

  <line x1="100" y1="306" x2="650" y2="306" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="90" y="310" text-anchor="end" font-size="11" fill="#64748b">20%</text>

  <line x1="100" y1="370" x2="650" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <text x="90" y="374" text-anchor="end" font-size="11" fill="#64748b">0%</text>

  <!-- Bar 1: Random - 33.3% -->
  <rect x="120" y="263" width="60" height="107" rx="4" fill="url(#bar1)"/>
  <text x="150" y="330" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">33.3%</text>
  <text x="150" y="390" text-anchor="middle" font-size="11" fill="#475569">Random</text>

  <!-- Bar 2: Cost-only baseline - 36.7% -->
  <rect x="210" y="252" width="60" height="118" rx="4" fill="url(#bar2)"/>
  <text x="240" y="320" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">36.7%</text>
  <text x="240" y="390" text-anchor="middle" font-size="11" fill="#475569">Cost-Only</text>

  <!-- Bar 3: Learned (test split, n=45) - 80.0% -->
  <rect x="300" y="114" width="60" height="256" rx="4" fill="url(#bar3)"/>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">80.0%</text>
  <text x="330" y="390" text-anchor="middle" font-size="11" fill="#475569">Learned (Test)</text>

  <!-- Bar 4: Learned (held-out, n=30) - 80.0% -->
  <rect x="390" y="114" width="60" height="256" rx="4" fill="url(#bar4)"/>
  <text x="420" y="200" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">80.0%</text>
  <text x="420" y="390" text-anchor="middle" font-size="11" fill="#475569">Learned (Held-Out)</text>

  <!-- Bar 5: Federated (preliminary) - 85% -->
  <rect x="480" y="98" width="60" height="272" rx="4" fill="url(#bar5)"/>
  <text x="510" y="185" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">85%*</text>
  <text x="510" y="390" text-anchor="middle" font-size="11" fill="#475569">Fed. (Prelim.)</text>

  <!-- Bar 6: Always-Best (oracle) - 100% -->
  <rect x="570" y="50" width="60" height="320" rx="4" fill="url(#bar6)"/>
  <text x="600" y="170" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">100%</text>
  <text x="600" y="390" text-anchor="middle" font-size="11" fill="#475569">Always-Best</text>

  <!-- Annotation: learned beats cost-only -->
  <line x1="240" y1="247" x2="420" y2="110" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="268" y="140" font-size="10" fill="#dc2626" transform="rotate(-31,268,140)">2.2× vs cost-only</text>

  <!-- Footer notes -->
  <text x="100" y="430" font-size="9" fill="#94a3b8">Metrics: 30 held-out prompts (6 categories × 5) | 3 model classes (gpt-oss-120b, hermes-3-405b, lfm-2.5-1.2b)</text>
  <text x="100" y="445" font-size="9" fill="#94a3b8">Router latency: 22ms median (M3 Pro) | Training: 224 samples, 163s | Fisher's exact test p = 1.4 × 10-3</text>
  <text x="100" y="460" font-size="9" fill="#94a3b8">*Preliminary simulated federated evaluation on 20 hand-curated prompts — not a published benchmark</text>
</svg>
